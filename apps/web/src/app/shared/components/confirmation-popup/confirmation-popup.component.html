@if (isOpen) {
<div class="confirm-overlay" (click)="onCancel()">
  <div class="confirm-card" (click)="$event.stopPropagation()" [class]="type">
    <div class="confirm-header">
      <div class="icon-wrapper">
        @if (type === 'danger') {
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path fill="currentColor"
            d="M11 15h2v2h-2zm0-8h2v6h-2zm.99-5C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z" />
        </svg>
        } @else if (type === 'warning') {
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path fill="currentColor" d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z" />
        </svg>
        } @else {
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path fill="currentColor"
            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z" />
        </svg>
        }
      </div>
      <h3>{{ title }}</h3>
    </div>

    <div class="confirm-body">
      <p>{{ message }}</p>
    </div>

    <div class="confirm-footer">
      <button class="secondary-btn" (click)="onCancel()">{{ cancelText }}</button>
      <button class="action-btn" (click)="onConfirm()">{{ confirmText }}</button>
    </div>
  </div>
</div>
}
