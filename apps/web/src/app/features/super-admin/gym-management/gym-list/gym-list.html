<div class="page-header">
  <h2>Gym List</h2>
  @if (selectedGyms.length === 0) {
  <button class="btn-add" (click)="openAddGymModal()">Add Gym</button>
  } @else {
  <button class="primary-btn edit-mode">Edit ({{ selectedGyms.length }} selected)</button>
  }
</div>
<!-- <app-filter-bar [filterConfigs]="filterConfigs" placeholder="Search gyms by name or location..."
  (filterChanged)="onFilterChanged($event)">
</app-filter-bar> -->

<app-data-grid [config]="gridConfig" [data]="displayData" [totalItems]="totalItems" [pageSize]="pageSize"
  [currentPage]="currentPage" (selectionChange)="onSelectionChange($event)" (actionEvent)="handleAction($event)"
  (pageChange)="onPageChanged($event)" (pageSizeChange)="onPageSizeChanged($event)">
</app-data-grid>

<!-- Gym Onboarding Modal -->
@if (isAddGymModalOpen)
{
<app-gym-onboarding-modal (close)="closeAddGymModal()">
</app-gym-onboarding-modal>
}
