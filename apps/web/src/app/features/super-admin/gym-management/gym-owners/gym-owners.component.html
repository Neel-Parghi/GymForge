<div class="standard-container">
  <div class="page-header">
    <div class="header-info">
      <h2>Gym Owners</h2>
      <p>Manage gym owner profiles and invitations.</p>
    </div>
    @if (selectedOwners.length === 0) {
    <button class="btn-add" (click)="openAddOwnerModal()">Add Owner</button>
    } @else {
    <button class="primary-btn edit-mode">Edit ({{ selectedOwners.length }} selected)</button>
    }
  </div>

  <app-filter-bar [filterConfigs]="filterConfigs" placeholder="Search by name, email or gym..."
    (filterChanged)="onFilterChanged($event)">
  </app-filter-bar>

  <app-data-grid [config]="gridConfig" [data]="displayData" [totalItems]="totalItems" [pageSize]="pageSize"
    [currentPage]="currentPage" (selectionChange)="onSelectionChange($event)" (actionEvent)="handleAction($event)"
    (pageChange)="onPageChanged($event)" (pageSizeChange)="onPageSizeChanged($event)">
  </app-data-grid>
</div>

@if (isAddOwnerModalOpen) {
<app-add-owner-modal (close)="closeAddOwnerModal()" (ownerInvited)="onOwnerInvited()">
</app-add-owner-modal>
}

<app-owner-details-drawer [isOpen]="isViewDrawerOpen" [isEditing]="isEditMode" [ownerContext]="selectedContext"
  (closeDrawer)="isViewDrawerOpen = false" (resendInvite)="reInvite($event)" (saveOwner)="updateGymOwner($event)">
</app-owner-details-drawer>
