<div class="modal-overlay">
  <div class="modal-container">

    <!-- Modal Header -->
    <div class="modal-header">
      <div class="header-titles">
        <h2>Invite Gym Owner</h2>
        <p>Send an invitation to a new gym owner to join the platform.</p>
      </div>
      <button class="close-btn" (click)="onTopClose()" title="Cancel">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path fill="currentColor"
            d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
        </svg>
      </button>
    </div>

    <!-- Modal Body with Form -->
    <div class="modal-body">
      <form [formGroup]="inviteForm" (ngSubmit)="submit()" class="invite-form">
        <div class="form-grid">
          <div class="form-group">
            <label>First Name *</label>
            <input type="text" formControlName="firstName" placeholder="Enter first name">
          </div>
          <div class="form-group">
            <label>Last Name *</label>
            <input type="text" formControlName="lastName" placeholder="Enter last name">
          </div>
          <div class="form-group">
            <label>Email Address *</label>
            <input type="email" formControlName="email" placeholder="owner@example.com">
          </div>
          <div class="form-group">
            <label>Phone Number *</label>
            <input type="text" formControlName="phone" placeholder="+1 234 567 8900">
          </div>
        </div>

        <div class="info-card">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor"
              d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z" />
          </svg>
          <p>The owner will receive an email with a link to set their account password and activate their dashboard.</p>
        </div>
      </form>
    </div>

    <!-- Modal Footer Actions -->
    <div class="modal-footer">
      <div class="footer-left">
        <button class="secondary-btn" (click)="onTopClose()">Cancel</button>
      </div>
      <div class="footer-right">
        <button class="primary-btn" (click)="submit()" [disabled]="inviteForm.invalid || isSubmitting">
          {{ isSubmitting ? 'Sending Invitation...' : 'Send Invitation' }}
        </button>
      </div>
    </div>

  </div>
</div>


@if (isConfirmCancelOpen) {
<app-confirmation-popup title="Discard Changes?" message="You have unsaved changes. Are you sure you want to cancel?"
  confirmText="Discard" cancelText="Keep Editing" type="danger" (confirm)="closeModal()"
  (cancel)="isConfirmCancelOpen = false">
</app-confirmation-popup>
}
