<div class="modal-overlay" (click)="closeModal()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    
    <div class="modal-header">
      <div class="header-titles">
        <h2>Add Subscription Plan</h2>
        <p>Create a new pricing tier for your platform.</p>
      </div>
      <button class="close-btn" (click)="closeModal()" title="Cancel">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
        </svg>
      </button>
    </div>

    <div class="modal-body">
      <form [formGroup]="pricingForm" class="pricing-form">
        
        <div class="form-grid">
          <div class="form-group lg">
            <label>Plan Name <span class="required">*</span></label>
            <input type="text" formControlName="name" placeholder="e.g. Pro Tier" />
            <app-validation-message [control]="pricingForm.get('name')" fieldName="Plan name"></app-validation-message>
          </div>

          <div class="form-group lg">
            <label>Description</label>
            <textarea formControlName="description" placeholder="Short description of benefits..."></textarea>
          </div>

          <div class="form-group">
            <label>Price ($) <span class="required">*</span></label>
            <input type="number" formControlName="price" placeholder="49.99" />
            <app-validation-message [control]="pricingForm.get('price')" fieldName="Price"></app-validation-message>
          </div>

          <div class="form-group">
            <label>Duration (Days) <span class="required">*</span></label>
            <input type="number" formControlName="durationInDays" placeholder="30" />
            <app-validation-message [control]="pricingForm.get('durationInDays')" fieldName="Duration"></app-validation-message>
          </div>

          <div class="form-group">
            <label>Max Branches <span class="optional">(Optional)</span></label>
            <input type="number" formControlName="maxBranches" placeholder="e.g. 5" />
          </div>

          <div class="form-group">
            <label>Max Members <span class="optional">(Optional)</span></label>
            <input type="number" formControlName="maxMembers" placeholder="e.g. 2000" />
          </div>

          <div class="form-group flex-row">
             <label class="toggle-switch">
                <input type="checkbox" formControlName="isTrial" />
                <span class="slider round"></span>
             </label>
             <div class="toggle-label">
                <strong>Is Trial Plan</strong>
                <span>Enable free trialing mode</span>
             </div>
          </div>

          <div class="form-group flex-row">
             <label class="toggle-switch">
                <input type="checkbox" formControlName="isActive" />
                <span class="slider round"></span>
             </label>
             <div class="toggle-label">
                <strong>Active Status</strong>
                <span>Plan is available for purchase</span>
             </div>
          </div>
        </div>
      </form>
    </div>

    <div class="modal-footer">
      <button class="secondary-btn" (click)="closeModal()">Cancel</button>
      <button class="primary-btn" (click)="onSubmit()" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Saving...' : 'Create Plan' }}
      </button>
    </div>
  </div>
</div>
