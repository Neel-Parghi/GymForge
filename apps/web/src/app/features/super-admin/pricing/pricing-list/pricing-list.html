<div class="page-header">
    <h2>Plans List</h2>
    @if (selectedPlans.length === 0) {
    <button class="btn-add" (click)="openAddPlanModal()">Add Plan</button>
    } @else {
    <button class="primary-btn edit-mode">Edit ({{ selectedPlans.length }} selected)</button>
    }
</div>
<app-filter-bar [filterConfigs]="filterConfigs" placeholder="Search plans by name or description..."
    (filterChanged)="onFilterChanged($event)">
</app-filter-bar>

<app-data-grid [config]="gridConfig" [data]="displayData" [totalItems]="totalItems" [pageSize]="pageSize"
    [currentPage]="currentPage" (selectionChange)="onSelectionChange($event)" (actionEvent)="handleAction($event)"
    (pageChange)="onPageChanged($event)" (pageSizeChange)="onPageSizeChanged($event)">
</app-data-grid>

<!-- Plan Details Drawer -->
<app-plan-details-drawer [isOpen]="isViewDrawerOpen" [isEditing]="isEditMode" [planContext]="selectedPlan"
    (closeDrawer)="isViewDrawerOpen = false" (savePlan)="onSavePlan($event)" (isEditingChange)="isEditMode = $event">
</app-plan-details-drawer>

<!-- Add Pricing Modal -->
@if (isAddPlanModalOpen)
{
<app-add-pricing (close)="closeAddPlanModal()" (planAdded)="onPlanAdded($event)">
</app-add-pricing>
}
