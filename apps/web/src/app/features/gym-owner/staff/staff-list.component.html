<div class="standard-container">
  <!-- Header Section -->
  <div class="page-header">
    <div class="header-info">
      <h2>Staff Directory</h2>
      <p>Manage your gym staff, roles and trainer assignments.</p>
    </div>
    <div class="actions">
      <button class="btn-export" (click)="exportToCsv()" [disabled]="staff.length === 0">
        <i class="fa-solid fa-download"></i> Export Report
      </button>
      <button class="primary-btn" (click)="onAddStaff()">Onboard Staff</button>
    </div>
  </div>

  <!-- Filter Bar -->
  <app-filter-bar [filterConfigs]="filterConfigs" placeholder="Search staff by name or email..." [debounce]="2000"
    (filterChanged)="onFilterChanged($event)">
  </app-filter-bar>

  <!-- Data Grid -->
  <app-data-grid [config]="gridConfig" [data]="staff" [totalItems]="totalItems" [pageSize]="pageSize"
    [currentPage]="currentPage" (actionEvent)="onAction($event)" (pageChange)="onPageChanged($event)"
    (pageSizeChange)="onPageSizeChanged($event)">
    <ng-template [gridCell]="'fullName'" let-row>
      <div class="staff-profile-cell clickable" (click)="onViewStaff(row)">
        <div class="avatar-container">
          <div class="avatar-circle">
            <img *ngIf="row.profilePictureUrl" [src]="row.profilePictureUrl" alt="avatar">
            <span *ngIf="!row.profilePictureUrl">{{ row.firstName[0] }}{{ row.lastName[0] }}</span>
          </div>
          <!-- Real-Time Duty Pulse Dot -->
          <span class="duty-pulse-dot" *ngIf="row.isCheckedIn" title="On Duty"></span>
        </div>
        <div class="profile-info">
          <span class="primary-text font-bold">{{ row.fullName }}</span>
          <span class="secondary-text">{{ row.staffNumber }}</span>
        </div>
      </div>
    </ng-template>
  </app-data-grid>
</div>

<!-- Modals & Drawers -->
<app-onboard-staff-modal *ngIf="isAddStaffModalOpen" [isEdit]="isEditMode" [staff]="selectedStaff" [branches]="branches"
  (close)="closeAddModal()" (staffOnboarded)="loadStaff(true)">
</app-onboard-staff-modal>

<app-staff-detail-drawer [isOpen]="isDrawerOpen" [staff]="selectedStaff" [branches]="branches"
  (close)="isDrawerOpen = false" (edit)="onEditStaff($any($event))" (statusChanged)="loadStaff(true)">
</app-staff-detail-drawer>

<app-confirmation-popup *ngIf="isConfirmDeleteOpen" title="Remove Staff Member?"
  [message]="'Are you sure you want to remove ' + staffToDelete?.firstName + ' ' + staffToDelete?.lastName + ' from your gym? This action cannot be undone.'"
  confirmText="Remove" cancelText="Cancel" type="danger" (confirm)="confirmDelete()"
  (cancel)="isConfirmDeleteOpen = false">
</app-confirmation-popup>
