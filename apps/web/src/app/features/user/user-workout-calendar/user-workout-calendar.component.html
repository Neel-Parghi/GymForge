  <app-member-detail-workout-calendar [workoutHistory]="workoutHistory" [activeSplit]="activeSplit"
    [planAssignments]="planAssignments" [workoutOverrides]="workoutOverrides" (openAssignModal)="openAssignSplitModal()"
    (updateOverrides)="onUpdateOverrides($event)" (logDateWorkout)="onLogDateWorkout($event)"
    (editWorkout)="onEditWorkoutSession($event)" (changeTab)="onTrackToday()">
  </app-member-detail-workout-calendar>

  <!-- WORKOUT ASSIGNMENT MODAL OVERLAY -->
  <div class="modal-overlay" *ngIf="showAssignSplitModal">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Assign Workout Template</h2>
        <button class="btn-close" (click)="closeAssignSplitModal()"><i class="fa-solid fa-times"></i></button>
      </div>
      <div class="modal-body-list">
        <p class="modal-desc">Select a workout split plan to assign to yourself</p>

        <ng-container *ngIf="workoutPlans.length > 0; else noWorkoutPlans">
          <div class="assign-template-item custom-plan-item" *ngFor="let plan of workoutPlans"
            (click)="assignWorkoutSplit(plan)">
            <div class="item-left">
              <strong>{{ plan.name }}</strong>
              <span>{{ plan.type }} • Level: {{ plan.level }} • Goal: {{ plan.goal }}</span>
            </div>
            <i class="fa-solid fa-chevron-right arrow-icon"></i>
          </div>
        </ng-container>

        <ng-template #noWorkoutPlans>
          <div class="empty-state-p24 empty-state">
            <i class="empty-icon-lg fa-solid fa-dumbbell"></i>
            <p>No workout plans created yet. Go to the Workout Planner to create templates.</p>
          </div>
        </ng-template>
      </div>
    </div>
  </div>
</div>
