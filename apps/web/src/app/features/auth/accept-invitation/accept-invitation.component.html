<div class="auth-container">
  <!-- Background circles -->
  <div class="auth-bg-circles">
    <div class="circle c1"></div>
    <div class="circle c2"></div>
    <div class="circle c3"></div>
    <div class="circle c4"></div>
  </div>

  <!-- Header Logo -->
  <div class="auth-logo-top">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="18" height="18" rx="5" />
      <path d="M9 9h6v6H9z" />
    </svg>
    <span>GYMForge</span>
  </div>

  <!-- Accept Invitation Card -->
  <div class="auth-card">
    <div class="icon-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
    </div>

    <h1 class="auth-title">Welcome to GYMForge</h1>
    <p class="auth-subtitle">Set up your account password to get started.</p>

    <!-- Loading State -->
    <div *ngIf="isValidating" class="state-container">
      <div class="loader"></div>
      <p>Validating your invitation...</p>
    </div>

    <!-- Error State -->
    <div *ngIf="!isValidating && !isTokenValid" class="state-container error">
      <div class="error-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <p>{{ errorMessage }}</p>
      <a routerLink="/login" class="btn-primary" style="text-decoration: none; display: inline-block; margin-top: 1rem;">Back to Login</a>
    </div>

    <!-- Success Flow (Form) -->
    <form *ngIf="!isValidating && isTokenValid" [formGroup]="acceptForm" (ngSubmit)="onSubmit()">
      
      <!-- Display general error message if any -->
      <div *ngIf="errorMessage" class="error-banner">
        {{ errorMessage }}
      </div>

      <!-- Password Input -->
      <div class="form-group">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
        <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="New Password" />
        <button type="button" class="password-toggle" (click)="togglePassword()">
          <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
            <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
            <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
            <line x1="2" y1="2" x2="22" y2="22" />
          </svg>
        </button>
      </div>
      <div class="password-requirements" *ngIf="acceptForm.get('password')?.touched && acceptForm.get('password')?.invalid">
        <small class="error-text">Password must be at least 8 characters and include uppercase, lowercase, number, and special character.</small>
      </div>

      <!-- Confirm Password Input -->
      <div class="form-group">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        </svg>
        <input [type]="showPassword ? 'text' : 'password'" formControlName="confirmPassword" placeholder="Confirm Password" />
      </div>
      <div class="password-requirements" *ngIf="acceptForm.get('confirmPassword')?.touched && acceptForm.errors?.['mismatch']">
        <small class="error-text">Passwords do not match.</small>
      </div>

      <button type="submit" class="btn-primary" [disabled]="acceptForm.invalid || isSubmitting">
        {{ isSubmitting ? 'Setting up...' : 'Create Password' }}
      </button>
    </form>
  </div>
</div>
