<div class="layout-wrapper">

  <!-- Sidebar -->
  <aside class="sidebar" [class.collapsed]="isSidebarCollapsed">
    <div class="sidebar-header">
      <h2 *ngIf="!isSidebarCollapsed">GymForge</h2>
      <div class="logo-mini" *ngIf="isSidebarCollapsed">GF</div>
      <button class="toggle-icon-btn" (click)="toggleSidebar()">
        <!-- Hamburger Icon -->
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path fill="currentColor" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
        </svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <ul>
        <li>
          <a routerLink="/super-admin/dashboard" routerLinkActive="active" class="nav-link">
            <svg viewBox="0 0 24 24" class="nav-icon">
              <path fill="currentColor" d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z" />
            </svg>
            <span class="nav-label">Dashboard</span>
          </a>
        </li>
        <!-- Gym Management Section -->
        <li class="nav-group">
          <div class="nav-group-title" (click)="isGymManagementExpanded = !isGymManagementExpanded">
            <div class="title-left">
              <svg viewBox="0 0 24 24" class="nav-icon">
                <path fill="currentColor"
                  d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM8 15h8v-2H8v2zm0-4h8V9H8v2z" />
              </svg>
              <span class="nav-label">Gym Management</span>
            </div>
            <svg viewBox="0 0 24 24" class="chevron-icon" *ngIf="!isSidebarCollapsed"
              [style.transform]="isGymManagementExpanded ? 'rotate(180deg)' : 'rotate(0deg)'">
              <path fill="currentColor" d="M7 10l5 5 5-5z" />
            </svg>
          </div>
          <ul class="sub-nav" *ngIf="isGymManagementExpanded && !isSidebarCollapsed">
            <li>
              <a routerLink="/super-admin/gym-list" routerLinkActive="active" class="nav-link">
                <!-- List Icon -->
                <svg viewBox="0 0 24 24" class="nav-icon" width="18" height="18">
                  <path fill="currentColor" d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/>
                </svg>
                <span class="nav-label">Gym List</span>
              </a>
            </li>
            <li>
              <a routerLink="/super-admin/gym-owners" routerLinkActive="active" class="nav-link">
                <!-- Users Icon -->
                <svg viewBox="0 0 24 24" class="nav-icon" width="18" height="18">
                  <path fill="currentColor" d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                </svg>
                <span class="nav-label">Gym Owners</span>
              </a>
            </li>
          </ul>
        </li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <button class="logout-btn" (click)="logout()" title="Log Out">
        <i class="fas fa-sign-out-alt nav-icon"></i>
        <span class="nav-label">Log Out</span>
      </button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <div class="main-content">

    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-search">
        <!-- Search input placeholder -->
      </div>
      <div class="topbar-right">
        <!-- <button class="theme-toggle" (click)="toggleTheme()" [title]="'Switch to ' + (currentTheme === 'light' ? 'dark' : 'light') + ' mode'">
          <i class="fas" [class.fa-sun]="currentTheme === 'dark'" [class.fa-moon]="currentTheme === 'light'"></i>
        </button> -->
        <div class="topbar-profile">
          <div class="profile-avatar">S</div>
          <span class="profile-name">Super Admin</span>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="page-content">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
