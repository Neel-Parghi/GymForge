<div class="layout-wrapper" *ngIf="isClientReady">
    <div class="gym-bg"></div>
    <div class="glass-overlay"></div>

    <app-sidebar-component [menuItems]="menuItems"></app-sidebar-component>

    <main class="content-area">
        <header class="top-bar">
            <div class="page-info">
                <!-- Dynamic breadcrumbs or title can go here -->
            </div>
            <div class="user-actions">
                <button class="logout-btn" (click)="logout()">Logout</button>
            </div>
        </header>

        <div class="router-target">
            <router-outlet></router-outlet>
        </div>
    </main>
</div>
